<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1950" viewBox="0 0 360 1950" role="img" aria-label="buyer/track">
  <title>buyer/track</title>
  <rect id="frame-background" x="0" y="0" width="360" height="1950" fill="#FFFFFF"/>
  <rect id="announcement-bar" x="0" y="0" width="360" height="64" fill="#000000"/>
