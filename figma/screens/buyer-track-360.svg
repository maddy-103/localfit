  <text id="track-promised-window-line-1" x="320" y="652" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(0, 0, 0, 0.6)" text-anchor="end">Promised</text>
  <text id="track-promised-window-line-2" x="320" y="673.6" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(0, 0, 0, 0.6)" text-anchor="end">window</text>
  <text id="track-promised-window-line-3" x="320" y="695.2" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(0, 0, 0, 0.6)" text-anchor="end">45–60</text>
  <text id="track-promised-window-line-4" x="320" y="716.8" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(0, 0, 0, 0.6)" text-anchor="end">min</text>
  <rect id="track-rider-card" x="16" y="702" width="328" height="96" fill="#FFFFFF" rx="20" stroke="rgba(0, 0, 0, 0.1)" stroke-width="1"/>
