  <rect id="track-call-rider-icon-hit-area" x="166" y="728" width="44" height="44" fill="none"/>
  <g id="track-call-rider-icon" transform="translate(176 738) scale(1)"><g fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7.2 3.5 9.6 8 7.5 9.8c1 2.2 2.5 3.7 4.7 4.7l1.8-2.1 4.5 2.4-.5 2.6c-.2 1-1 1.6-2 1.6C9.4 19 5 14.6 4.9 7.9c0-1 .6-1.8 1.6-2l.7-.4Z"></path></g></g>
  <rect id="track-otp-card" x="16" y="822" width="328" height="132" fill="#F2F0F1" rx="20"/>
  <text id="track-otp-title-line-1" x="40" y="862" font-family="Satoshi" font-weight="700" font-size="16" fill="#000000">Handover code</text>
  <text id="track-otp-body-line-1" x="40" y="894" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(0, 0, 0, 0.6)">Read this 4-digit code to the rider</text>
  <text id="track-otp-body-line-2" x="40" y="915.6" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(0, 0, 0, 0.6)">when they arrive.</text>
  <text id="track-otp-code-line-1" x="164" y="906" font-family="ui-monospace, monospace" font-weight="700" font-size="32" fill="#000000" letter-spacing="4.8px">4832</text>
  <text id="track-timeline-title-line-1" x="16" y="998" font-family="Archivo" font-weight="900" font-size="24" fill="#000000">Order timeline</text>
  <path id="timeline-line-0" d="M36 1062L36 1130" stroke="rgba(0, 0, 0, 0.1)" stroke-width="2" fill="none"/>
  <rect id="timeline-dot-0" x="24" y="1046" width="24" height="24" fill="#000000" rx="12"/>
  <text id="timeline-label-0-line-1" x="64" y="1065" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">PLACED</text>
  <path id="timeline-line-1" d="M36 1146L36 1214" stroke="rgba(0, 0, 0, 0.1)" stroke-width="2" fill="none"/>
  <rect id="timeline-dot-1" x="24" y="1130" width="24" height="24" fill="#000000" rx="12"/>
  <text id="timeline-label-1-line-1" x="64" y="1149" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">SHOP_ACCEPTED</text>
  <path id="timeline-line-2" d="M36 1230L36 1298" stroke="rgba(0, 0, 0, 0.1)" stroke-width="2" fill="none"/>
  <rect id="timeline-dot-2" x="24" y="1214" width="24" height="24" fill="#000000" rx="12"/>
  <text id="timeline-label-2-line-1" x="64" y="1233" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">PACKED</text>
  <rect id="timeline-dot-3" x="24" y="1298" width="24" height="24" fill="#F0F0F0" rx="12"/>
  <text id="timeline-label-3-line-1" x="64" y="1317" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(0, 0, 0, 0.6)">OUT_FOR_DELIVERY</text>
  <rect id="track-support" x="16" y="1476" width="220" height="48" fill="#FFFFFF" rx="62" stroke="#000000" stroke-width="1.5"/>
  <text id="track-support-label-line-1" x="60" y="1506" font-family="Satoshi" font-weight="700" font-size="16" fill="#000000" text-anchor="start">Contact support</text>
  <rect id="track-support-icon-hit-area" x="18" y="1478" width="44" height="44" fill="none"/>
  <g id="track-support-icon" transform="translate(28 1488) scale(1)"><g fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 20 6v5.6c0 4.7-3.3 7.7-8 9.4-4.7-1.7-8-4.7-8-9.4V6l8-3Z"></path><path d="m8.7 12 2.2 2.2 4.4-4.5"></path></g></g>
  <rect id="site-footer" x="0" y="1720" width="360" height="176" fill="#000000"/>
  <text id="footer-brand-line-1" x="16" y="1768" font-family="Archivo" font-weight="900" font-size="24" fill="#FFFFFF">LOCALFIT</text>
  <text id="footer-tagline-line-1" x="16" y="1808" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(255, 255, 255, 0.7)">Nearby shops. Real stock. Fifteen</text>
  <text id="footer-tagline-line-2" x="16" y="1829.6" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(255, 255, 255, 0.7)">minutes to decide at your door.</text>
  <text id="footer-legal-line-1" x="16" y="1852" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(255, 255, 255, 0.6)">Prices include GST. LocalFit is a</text>
  <text id="footer-legal-line-2" x="16" y="1873.6" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(255, 255, 255, 0.6)">marketplace for verified local shops.</text>
