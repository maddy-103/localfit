  <text id="trial-item-0-default-line-1" x="228" y="576" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(0, 0, 0, 0.6)">Not marked yet — returns by default</text>
  <rect id="trial-item-0-keep" x="228" y="604" width="116" height="44" fill="#FFFFFF" rx="62" stroke="#000000" stroke-width="1.5"/>
  <text id="trial-item-0-keep-label-line-1" x="236" y="632" font-family="Satoshi" font-weight="700" font-size="16" fill="#000000" text-anchor="middle">Keep</text>
  <rect id="trial-item-0-return" x="352" y="604" width="116" height="44" fill="#FFFFFF" rx="62" stroke="#000000" stroke-width="1.5"/>
  <text id="trial-item-0-return-label-line-1" x="360" y="632" font-family="Satoshi" font-weight="700" font-size="16" fill="#000000" text-anchor="middle">Return</text>
  <rect id="trial-item-1-photo" x="116" y="664" width="96" height="96" fill="#E2E8DF" rx="20"/>
  <text id="trial-item-1-name-line-1" x="228" y="694" font-family="Satoshi" font-weight="700" font-size="16" fill="#000000">Linen shirt · L</text>
  <text id="trial-item-1-default-line-1" x="228" y="724" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(0, 0, 0, 0.6)">Not marked yet — returns by default</text>
  <rect id="trial-item-1-keep" x="228" y="752" width="116" height="44" fill="#FFFFFF" rx="62" stroke="#000000" stroke-width="1.5"/>
  <text id="trial-item-1-keep-label-line-1" x="236" y="780" font-family="Satoshi" font-weight="700" font-size="16" fill="#000000" text-anchor="middle">Keep</text>
  <rect id="trial-item-1-return" x="352" y="752" width="116" height="44" fill="#FFFFFF" rx="62" stroke="#000000" stroke-width="1.5"/>
  <text id="trial-item-1-return-label-line-1" x="360" y="780" font-family="Satoshi" font-weight="700" font-size="16" fill="#000000" text-anchor="middle">Return</text>
  <rect id="size-swap-button" x="100" y="852" width="300" height="48" fill="#FFFFFF" rx="62" stroke="#000000" stroke-width="1.5"/>
  <text id="size-swap-button-label-line-1" x="144" y="882" font-family="Satoshi" font-weight="700" font-size="16" fill="#000000" text-anchor="start">Request size swap</text>
  <rect id="size-swap-button-icon-hit-area" x="102" y="854" width="44" height="44" fill="none"/>
  <g id="size-swap-button-icon" transform="translate(112 864) scale(1)"><g fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h5M15 7h5M4 17h9M19 17h1"></path><circle cx="12" cy="7" r="2.3"></circle><circle cx="15.5" cy="17" r="2.3"></circle></g></g>
  <rect id="confirm-decisions-button" x="100" y="916" width="300" height="48" fill="#000000" rx="62"/>
  <text id="confirm-decisions-button-label-line-1" x="108" y="946" font-family="Satoshi" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle">Confirm decisions</text>
  <rect id="site-footer" x="0" y="970" width="1440" height="176" fill="#000000"/>
  <text id="footer-brand-line-1" x="16" y="1018" font-family="Archivo" font-weight="900" font-size="24" fill="#FFFFFF">LOCALFIT</text>
  <text id="footer-tagline-line-1" x="16" y="1058" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(255, 255, 255, 0.7)">Nearby shops. Real stock. Fifteen minutes to decide at your door.</text>
  <text id="footer-legal-line-1" x="16" y="1102" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(255, 255, 255, 0.6)">Prices include GST. LocalFit is a marketplace for verified local shops.</text>
