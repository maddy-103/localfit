<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1150" viewBox="0 0 1440 1150" role="img" aria-label="buyer/trial timer normal">
  <title>buyer/trial timer normal</title>
  <rect id="frame-background" x="0" y="0" width="1440" height="1150" fill="#FFFFFF"/>
  <rect id="announcement-bar" x="0" y="0" width="1440" height="64" fill="#000000"/>
