<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1750" viewBox="0 0 1440 1750" role="img" aria-label="buyer/checkout pay enabled">
  <title>buyer/checkout pay enabled</title>
  <rect id="frame-background" x="0" y="0" width="1440" height="1750" fill="#FFFFFF"/>
  <rect id="announcement-bar" x="0" y="0" width="1440" height="64" fill="#000000"/>
  <text id="announcement-copy-line-1" x="100" y="29" font-family="Satoshi" font-weight="400" font-size="16" fill="#FFFFFF">Sign up and get 20% off your first order. Sign up now</text>
  <rect id="announcement-close-hit-area" x="1390" y="10" width="44" height="44" fill="none"/>
  <g id="announcement-close" transform="translate(1400 20) scale(1)"><g fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"></path></g></g>
  <rect id="site-header" x="0" y="64" width="1440" height="72" fill="#FFFFFF"/>
  <text id="header-logo-line-1" x="100" y="110" font-family="Archivo" font-weight="900" font-size="24" fill="#000000" letter-spacing="-0.32px">LOCALFIT</text>
  <text id="header-nav-0-line-1" x="280" y="110" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">Shop</text>
  <rect id="header-nav-chevron-hit-area" x="350" y="88" width="44" height="44" fill="none"/>
  <g id="header-nav-chevron" transform="translate(364 102) scale(0.7)"><g fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></g></g>
  <text id="header-nav-1-line-1" x="400" y="110" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">Occasions</text>
  <text id="header-nav-2-line-1" x="520" y="110" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">Near you</text>
  <rect id="header-search-field" x="700" y="76" width="420" height="48" fill="#F0F0F0" rx="62"/>
  <rect id="header-search-icon-hit-area" x="706" y="78" width="44" height="44" fill="none"/>
  <g id="header-search-icon" transform="translate(716 88) scale(1)"><g fill="none" stroke="rgba(0, 0, 0, 0.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m16.4 16.4 4.1 4.1"></path></g></g>
  <text id="header-search-placeholder-line-1" x="750" y="107" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(0, 0, 0, 0.6)">Search for a size, colour or shop</text>
  <rect id="header-cart-hit-area" x="1242" y="78" width="44" height="44" fill="none"/>
  <g id="header-cart" transform="translate(1252 88) scale(1)"><g fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.3 10.8a1.8 1.8 0 0 0 1.8 1.4h7.9a1.8 1.8 0 0 0 1.8-1.4L21 8H6"></path><circle cx="10" cy="20" r="1.2"></circle><circle cx="18" cy="20" r="1.2"></circle></g></g>
  <rect id="header-account-hit-area" x="1286" y="78" width="44" height="44" fill="none"/>
  <g id="header-account" transform="translate(1296 88) scale(1)"><g fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="9.5" r="3"></circle><path d="M6.4 18.4a6.2 6.2 0 0 1 11.2 0"></path></g></g>
  <path id="header-divider" d="M0 136L1440 136" stroke="rgba(0, 0, 0, 0.1)" stroke-width="1" fill="none"/>
  <text id="checkout-title-line-1" x="100" y="200" font-family="Archivo" font-weight="900" font-size="48" fill="#000000">CHECKOUT</text>
  <rect id="address-card" x="100" y="236" width="840" height="130" fill="#FFFFFF" rx="20" stroke="rgba(0, 0, 0, 0.1)" stroke-width="1"/>
  <rect id="address-pin-hit-area" x="110" y="250" width="44" height="44" fill="none"/>
  <g id="address-pin" transform="translate(120 260) scale(1)"><g fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s6.5-5.7 6.5-10.5a6.5 6.5 0 1 0-13 0C5.5 15.3 12 21 12 21Z"></path><circle cx="12" cy="10.3" r="2.4"></circle></g></g>
  <text id="address-title-line-1" x="156" y="280" font-family="Satoshi" font-weight="700" font-size="16" fill="#000000">Deliver to</text>
  <text id="address-lines-line-1" x="156" y="314" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">42, Second Cross, Indiranagar, Bengaluru 560038</text>
  <text id="address-inside-area-line-1" x="156" y="346" font-family="Satoshi" font-weight="400" font-size="16" fill="#00661A">Inside this shop’s delivery area</text>
  <rect id="payment-card" x="100" y="386" width="840" height="200" fill="#FFFFFF" rx="20" stroke="rgba(0, 0, 0, 0.1)" stroke-width="1"/>
  <text id="payment-title-line-1" x="124" y="428" font-family="Satoshi" font-weight="700" font-size="20" fill="#000000">Payment method</text>
  <rect id="payment-radio-upi" x="124" y="456" width="384" height="48" fill="#F2F0F1" rx="62" stroke="#000000" stroke-width="1"/>
  <text id="payment-radio-upi-label-line-1" x="144" y="487" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">UPI</text>
  <rect id="payment-radio-card" x="532" y="456" width="384" height="48" fill="#FFFFFF" rx="62" stroke="rgba(0, 0, 0, 0.1)" stroke-width="1"/>
  <text id="payment-radio-card-label-line-1" x="552" y="487" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">Card</text>
  <rect id="payment-radio-wallet" x="124" y="516" width="384" height="48" fill="#FFFFFF" rx="62" stroke="rgba(0, 0, 0, 0.1)" stroke-width="1"/>
  <text id="payment-radio-wallet-label-line-1" x="144" y="547" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">Wallet</text>
  <rect id="payment-radio-cod" x="532" y="516" width="384" height="48" fill="#FFFFFF" rx="62" stroke="rgba(0, 0, 0, 0.1)" stroke-width="1"/>
  <text id="payment-radio-cod-label-line-1" x="552" y="547" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">Cash on delivery</text>
  <text id="checkout-split-note-line-1" x="100" y="612" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(0, 0, 0, 0.6)">Items from 2 shops become 2 orders, each with its own ETA and settlement.</text>
  <rect id="trial-terms-block" x="100" y="656" width="840" height="660" fill="#FFFFFF" rx="20" stroke="rgba(0, 0, 0, 0.1)" stroke-width="1"/>
  <text id="trial-terms-title-line-1" x="124" y="698" font-family="Archivo" font-weight="900" font-size="28" fill="#000000">Try before you pay</text>
  <text id="trial-terms-copy-line-1" x="124" y="738" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">You can try items at your door. Items you don’t keep go back with the rider, and you pay only</text>
  <text id="trial-terms-copy-line-2" x="124" y="759.6" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">for what you keep.</text>
  <text id="trial-terms-default-title-line-1" x="124" y="832" font-family="Satoshi" font-weight="700" font-size="16" fill="#000000">Not marked yet — returns by default</text>
  <text id="trial-terms-default-line-1" x="124" y="864" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">If you don’t mark an item before the 15-minute timer ends, it is treated as Return and goes</text>
  <text id="trial-terms-default-line-2" x="124" y="885.6" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">back with the rider.</text>
  <text id="trial-terms-payment-title-line-1" x="124" y="964" font-family="Satoshi" font-weight="700" font-size="16" fill="#000000">Authorization hold or charge</text>
  <text id="trial-terms-card-line-1" x="124" y="996" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">Card: the full amount is held when you order. On confirmation only kept items are captured, and</text>
  <text id="trial-terms-card-line-2" x="124" y="1017.6" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">the hold on returned items is released. Released holds can take 5–7 working days to drop off</text>
  <text id="trial-terms-card-line-3" x="124" y="1039.2" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">your statement.</text>
  <text id="trial-terms-upi-line-1" x="124" y="1112" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">UPI: the full amount is charged when you order. Returned items are refunded to your UPI 2–3</text>
  <text id="trial-terms-upi-line-2" x="124" y="1133.6" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">working days after the shop receives them back.</text>
  <text id="trial-terms-wallet-line-1" x="124" y="1196" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">Wallet: the full amount is charged when you order. Returned items are refunded to your wallet</text>
  <text id="trial-terms-wallet-line-2" x="124" y="1217.6" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">0–1 working day after the shop receives them back.</text>
  <text id="trial-terms-cod-line-1" x="124" y="1280" font-family="Satoshi" font-weight="400" font-size="16" fill="#C62828">Cash on delivery is never available on try-at-door orders.</text>
  <rect id="terms-checkbox-checked" x="100" y="1346" width="44" height="44" fill="#000000" rx="8" stroke="#000000" stroke-width="1"/>
  <rect id="terms-checkbox-tick-hit-area" x="100" y="1346" width="44" height="44" fill="none"/>
  <g id="terms-checkbox-tick" transform="translate(110 1356) scale(1)"><g><circle cx="12" cy="12" r="10" fill="#FFFFFF" stroke="none"></circle><path d="m7.5 12.3 3 3 6-6.6" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></g></g>
  <text id="terms-checkbox-label-line-1" x="160" y="1376" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">I have read these terms</text>
  <rect id="pay-button-enabled" x="100" y="1414" width="840" height="52" fill="#000000" rx="62"/>
  <text id="pay-button-enabled-label-line-1" x="108" y="1446" font-family="Satoshi" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle">Pay ₹2,198</text>
  <rect id="site-footer" x="0" y="1520" width="1440" height="176" fill="#000000"/>
  <text id="footer-brand-line-1" x="16" y="1568" font-family="Archivo" font-weight="900" font-size="24" fill="#FFFFFF">LOCALFIT</text>
  <text id="footer-tagline-line-1" x="16" y="1608" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(255, 255, 255, 0.7)">Nearby shops. Real stock. Fifteen minutes to decide at your door.</text>
  <text id="footer-legal-line-1" x="16" y="1652" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(255, 255, 255, 0.6)">Prices include GST. LocalFit is a marketplace for verified local shops.</text>
</svg>
