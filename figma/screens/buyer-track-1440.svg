  <text id="track-live-note-line-1" x="100" y="584" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(0, 0, 0, 0.6)">Live location updates every few seconds.</text>
  <rect id="track-eta-card" x="100" y="566" width="760" height="112" fill="#FFFFFF" rx="20" stroke="rgba(0, 0, 0, 0.1)" stroke-width="1"/>
  <text id="track-eta-label-line-1" x="124" y="606" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(0, 0, 0, 0.6)">Arriving in</text>
