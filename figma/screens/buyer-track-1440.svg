  <text id="track-promised-window-line-1" x="836" y="652" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(0, 0, 0, 0.6)" text-anchor="end">Promised window 45–60 min</text>
  <rect id="track-rider-card" x="100" y="702" width="760" height="96" fill="#FFFFFF" rx="20" stroke="rgba(0, 0, 0, 0.1)" stroke-width="1"/>
  <text id="track-rider-label-line-1" x="124" y="740" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(0, 0, 0, 0.6)">Your rider</text>
  <text id="track-rider-name-line-1" x="124" y="774" font-family="Satoshi" font-weight="700" font-size="16" fill="#000000">Karthik R.</text>
  <rect id="track-call-rider" x="680" y="726" width="160" height="48" fill="#FFFFFF" rx="62" stroke="#000000" stroke-width="1.5"/>
  <text id="track-call-rider-label-line-1" x="724" y="756" font-family="Satoshi" font-weight="700" font-size="16" fill="#000000" text-anchor="start">Call rider</text>
  <rect id="track-call-rider-icon-hit-area" x="682" y="728" width="44" height="44" fill="none"/>
  <g id="track-call-rider-icon" transform="translate(692 738) scale(1)"><g fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7.2 3.5 9.6 8 7.5 9.8c1 2.2 2.5 3.7 4.7 4.7l1.8-2.1 4.5 2.4-.5 2.6c-.2 1-1 1.6-2 1.6C9.4 19 5 14.6 4.9 7.9c0-1 .6-1.8 1.6-2l.7-.4Z"></path></g></g>
  <rect id="track-otp-card" x="100" y="822" width="760" height="132" fill="#F2F0F1" rx="20"/>
  <text id="track-otp-title-line-1" x="124" y="862" font-family="Satoshi" font-weight="700" font-size="16" fill="#000000">Handover code</text>
  <text id="track-otp-body-line-1" x="124" y="894" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(0, 0, 0, 0.6)">Read this 4-digit code to the rider when they arrive.</text>
  <text id="track-otp-code-line-1" x="680" y="906" font-family="ui-monospace, monospace" font-weight="700" font-size="32" fill="#000000" letter-spacing="4.8px">4832</text>
  <text id="track-timeline-title-line-1" x="100" y="998" font-family="Archivo" font-weight="900" font-size="24" fill="#000000">Order timeline</text>
  <path id="timeline-line-0" d="M120 1062L120 1130" stroke="rgba(0, 0, 0, 0.1)" stroke-width="2" fill="none"/>
  <rect id="timeline-dot-0" x="108" y="1046" width="24" height="24" fill="#000000" rx="12"/>
  <text id="timeline-label-0-line-1" x="148" y="1065" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">PLACED</text>
  <path id="timeline-line-1" d="M120 1146L120 1214" stroke="rgba(0, 0, 0, 0.1)" stroke-width="2" fill="none"/>
  <rect id="timeline-dot-1" x="108" y="1130" width="24" height="24" fill="#000000" rx="12"/>
  <text id="timeline-label-1-line-1" x="148" y="1149" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">SHOP_ACCEPTED</text>
  <path id="timeline-line-2" d="M120 1230L120 1298" stroke="rgba(0, 0, 0, 0.1)" stroke-width="2" fill="none"/>
  <rect id="timeline-dot-2" x="108" y="1214" width="24" height="24" fill="#000000" rx="12"/>
  <text id="timeline-label-2-line-1" x="148" y="1233" font-family="Satoshi" font-weight="400" font-size="16" fill="#000000">PACKED</text>
  <rect id="timeline-dot-3" x="108" y="1298" width="24" height="24" fill="#F0F0F0" rx="12"/>
  <text id="timeline-label-3-line-1" x="148" y="1317" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(0, 0, 0, 0.6)">OUT_FOR_DELIVERY</text>
  <rect id="track-support" x="100" y="1476" width="220" height="48" fill="#FFFFFF" rx="62" stroke="#000000" stroke-width="1.5"/>
  <text id="track-support-label-line-1" x="144" y="1506" font-family="Satoshi" font-weight="700" font-size="16" fill="#000000" text-anchor="start">Contact support</text>
  <rect id="track-support-icon-hit-area" x="102" y="1478" width="44" height="44" fill="none"/>
  <g id="track-support-icon" transform="translate(112 1488) scale(1)"><g fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 20 6v5.6c0 4.7-3.3 7.7-8 9.4-4.7-1.7-8-4.7-8-9.4V6l8-3Z"></path><path d="m8.7 12 2.2 2.2 4.4-4.5"></path></g></g>
  <rect id="site-footer" x="0" y="1720" width="1440" height="176" fill="#000000"/>
  <text id="footer-brand-line-1" x="16" y="1768" font-family="Archivo" font-weight="900" font-size="24" fill="#FFFFFF">LOCALFIT</text>
  <text id="footer-tagline-line-1" x="16" y="1808" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(255, 255, 255, 0.7)">Nearby shops. Real stock. Fifteen minutes to decide at your door.</text>
  <text id="footer-legal-line-1" x="16" y="1852" font-family="Satoshi" font-weight="400" font-size="16" fill="rgba(255, 255, 255, 0.6)">Prices include GST. LocalFit is a marketplace for verified local shops.</text>
